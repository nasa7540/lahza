<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lahza | لحظة — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@200;300;400;500;600;700&display=swap">
<style>
:root{--teal:#0F4C5C;--gold:#B8893B;--goldD:#8C6527;--sand:#D9C6A0;--cream:#FAF7F2;--card:#FFFDF8;--line:#ECE6DA;--beige:#F5EFE3;--ic:#E3EDEF;--ink:#1F2A30;--mute:#6B7378;--body:#3A464C}
*{box-sizing:border-box}
html,body{margin:0;background:#EFE9DE;color:var(--ink);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif}
button{font:inherit;cursor:pointer}textarea{font:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 40px}
.topbar{width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;direction:ltr}
.logo .la{font-weight:300;font-size:20px;color:var(--teal)}
.logo .bar{width:1.5px;height:24px;background:var(--gold)}
.logo .ar{font-family:'IBM Plex Sans Arabic';font-weight:700;font-size:28px;color:var(--teal);line-height:1}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
.nav button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.langs{display:flex;gap:6px}
.langs button{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--teal);font-weight:600}
.langs button.on{border:1.5px solid var(--teal);background:var(--ic)}
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 120px);min-height:640px;border-radius:44px;background:#14232A;padding:10px;box-shadow:0 30px 60px rgba(15,76,92,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--cream)}
.scroll{position:relative;z-index:1;height:100%;overflow-y:auto;padding:22px 22px 28px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.orn{position:absolute;width:220px;height:220px;opacity:.11;pointer-events:none;z-index:0}
.orn.tr{top:-24px;right:-44px}.orn.bl{bottom:-24px;left:-44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(15,76,92,.04)}
.feat{background:var(--beige);border:1px solid var(--gold);border-radius:16px}
.ic{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--ic);color:var(--teal);display:flex;align-items:center;justify-content:center}
.ic.s{width:34px;height:34px}
.k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--goldD)}
h1{margin:0;font-size:23px;line-height:1.35;font-weight:700;color:var(--teal)}
h2{margin:0;font-size:17px;font-weight:700;color:var(--teal)}
.ul{width:36px;height:2px;background:var(--gold);border-radius:2px}
.mute{color:var(--mute)}
.btn{height:52px;border:none;border-radius:14px;background:var(--teal);color:#fff;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;width:100%;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);border:1.5px solid var(--teal);color:var(--teal)}
.btn.lock{background:var(--card);border:1px dashed var(--sand);color:var(--mute);cursor:default}
.link{background:none;border:none;color:var(--teal);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;padding:10px}
.hdr{display:flex;align-items:center;gap:12px}
.back{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--teal);display:flex;align-items:center;justify-content:center}
.prog{flex-grow:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prog span{height:4px;border-radius:4px;background:var(--line)}.prog span.on{background:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--beige);border:1px solid var(--gold);color:var(--goldD);font-size:11.5px;font-weight:600}
.opt{min-height:52px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;text-align:start;font-size:15px;color:var(--ink);border:1px solid var(--line);background:var(--card)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #C9CFD2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.on{border:1.5px solid var(--teal);background:var(--ic);font-weight:600}
.opt.on .dot{border-color:var(--teal)}.opt.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.dark{position:relative;overflow:hidden;background:var(--teal);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px rgba(15,76,92,.18)}
.dark .k{color:var(--sand)}
.node{display:flex;align-items:center;gap:14px;position:relative}
.node .c{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.node .b{flex-grow:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:start}
.chk{position:absolute;bottom:-2px;inset-inline-end:-2px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;border:2px solid var(--cream);display:flex;align-items:center;justify-content:center}
textarea.f{resize:none;width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--sand);background:var(--card);color:var(--ink);font-size:15px;line-height:1.6}
.switch{position:relative;width:52px;height:32px;border-radius:16px;border:none;padding:0;background:#C9CFD2;flex-shrink:0}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--teal)}.switch.on span{left:24px}
/* dashboard */
.dash{width:100%;max-width:1200px;background:var(--cream);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(15,76,92,.15);position:relative}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
.caption{max-width:640px;text-align:center;font-size:13px;color:var(--mute)}
</style>
</head>

   <span class="mute" style="font-size:12.5px">Summaries are written by the employee's app and approved by them before they arrive.</span>
   ${reqs.map(([id,time,topic,lang,sum])=>{const c=!!S.claimed[id];return `<div style="padding:16px;border:1px solid var(--line);border-radius:14px;background:${c?'var(--cream)':'#fff'};display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between"><span style="padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;${c?'background:var(--ic);color:var(--teal)':'background:var(--sand)'}">${c?'Claimed':'New request'}</span><span class="mute" style="font-size:12px">${time}</span></div><b style="font-size:14.5px">Topic: ${topic}</b><span style="font-size:13.5px;line-height:1.55;color:var(--body)">${sum}</span><div style="display:flex;justify-content:space-between;align-items:center"><span class="mute" style="font-size:12px">Asked in ${lang}</span>${c?`<span style="font-size:13px;font-weight:600;color:var(--teal);display:flex;gap:6px;align-items:center;height:40px">${I.check}Claimed by you · Reply</span>`:`<button onclick="S.claimed['${id}']=1;render()" style="height:40px;padding:0 16px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-weight:600;font-size:13.5px">Claim request</button>`}</div></div>`}).join('')}
  </section>
  <section style="display:flex;flex-direction:column;gap:16px">
   <div style="display:flex;justify-content:space-between;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px"><h2 style="font-size:19px">Anonymous impact</h2><span class="ul" style="width:28px"></span></div><span style="padding:4px 10px;border-radius:20px;border:1px dashed var(--gold);color:var(--goldD);font-size:11.5px;font-weight:600">Sample data</span></div>
   <div class="kpis">
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:6px"><span class="mute" style="font-size:12.5px;font-weight:600">Journeys completed</span><b style="font-size:34px;color:var(--gold);line-height:1.1">1,284</b><span style="font-size:12px;color:var(--teal)">+212 vs previous 30 days</span></div>
    <div class="feat" style="padding:18px;display:flex;flex-direction:column;gap:6px"><span class="mute" style="font-size:12.5px;font-weight:600">Avg. understanding</span><b style="font-size:34px;color:var(--teal);line-height:1.1">2.3 <span style="font-size:20px;color:var(--goldD)">→</span> 4.3</b><span class="mute" style="font-size:12px">out of 5, before → after</span></div>
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:6px"><span class="mute" style="font-size:12.5px;font-weight:600">Specialist requests</span><b style="font-size:34px;color:var(--gold);line-height:1.1">18</b><span class="mute" style="font-size:12px">median first reply · [TIME]</span></div>
   </div>
   <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><b style="font-size:15px">Understanding before and after each journey</b><div style="display:flex;gap:16px;font-size:12.5px"><span style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:var(--sand)"></span>Before</span><span style="display:flex;gap:6px;align-items:center"><span style="width:12px;height:12px;border-radius:3px;background:var(--teal)"></span>After</span></div></div>
    <div style="height:200px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;border-bottom:1px solid var(--sand);background:repeating-linear-gradient(to top,transparent 0 39px,#F1ECE2 39px 40px)">${bars.map(([n,b,a])=>`<div role="img" aria-label="${n}: before ${b.toFixed(1)}, after ${a.toFixed(1)} of 5" style="display:flex;align-items:flex-end;justify-content:center;gap:6px">${[[b,'var(--sand)','var(--mute)'],[a,'var(--teal)','var(--teal)']].map(([v,c,tc])=>`<div style="width:34%;max-width:38px;display:flex;flex-direction:column;align-items:center"><span style="font-size:11.5px;font-weight:600;color:${tc};padding-bottom:4px">${v.toFixed(1)}</span><span style="width:100%;height:${Math.round(v/5*200)}px;border-radius:6px 6px 0 0;background:${c}"></span></div>`).join('')}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px">${bars.map(b=>`<span style="text-align:center;font-size:12.5px;font-weight:600">${b[0]}</span>`).join('')}</div>
    <span class="mute" style="font-size:11.5px">Before: a one-tap self-check at the start of a journey. After: the AI score from “Explain it in your words”. Averages only.</span>
   </div>
   <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:14px"><b style="font-size:15px">Most-corrected misconceptions</b>
    ${mis.map(([l,n],i)=>`<div style="display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,3fr) 48px;gap:14px;align-items:center"><span style="font-size:13.5px">“${l}”</span><span style="height:10px;border-radius:5px;background:var(--beige);overflow:hidden"><span style="display:block;height:100%;width:${n/412*100}%;border-radius:5px;background:${i?'var(--teal)':'var(--gold)'}"></span></span><b style="font-size:13px;color:var(--teal);text-align:end">${n}</b></div>`).join('')}
    <span class="mute" style="font-size:11.5px">Times a journey's “reveal” corrected the option a learner first picked.</span>
   </div>
  </section>
 </div>
</div></div>`; }

function langBtns(cls){ const L={en:'English',ar:'العربية',ur:'اردو'}; return Object.keys(L).map(l=>`<button role="radio" aria-checked="${S.lang===l}" class="${cls} ${S.lang===l?'on':''}" style="${cls==='opt'?'justify-content:center;height:44px;min-height:44px;font-weight:600;':''}font-family:${l==='en'?"'IBM Plex Sans'":"'IBM Plex Sans Arabic'"}" onclick="set({lang:'${l}',text:null})">${L[l]}</button>`).join(''); }

function render(){
 const n=S.screen, t=D[S.lang], multi = n<=6, rtl = multi && S.lang!=='en';
 document.getElementById('nav').innerHTML = SCREENS.map(([i,l])=>`<button class="${i===n?'on':''}" onclick="go(${i})">${l}</button>`).join('');
 document.getElementById('langs').innerHTML = multi ? langBtns('') : '<span class="mute" style="font-size:12px;align-self:center">English only</span>';
 document.getElementById('cap').textContent = CAPS[n];
 const v=document.getElementById('view');
 if(n===9){ v.style.width='100%'; v.style.display='flex'; v.style.justifyContent='center'; v.innerHTML=s9(); return; }
 v.style.width='';
 const body = [null,s1,s2,s3,s4,s5,s6,s7,s8][n](t);
 const prevScroll = document.querySelector('.scroll'); const keep = prevScroll && prevScroll.dataset.n==String(n) ? prevScroll.scrollTop : 0;
 v.innerHTML = `<div class="phone"><div class="screen" dir="${rtl?'rtl':'ltr'}" lang="${multi?S.lang:'en'}" style="font-family:${rtl?"'IBM Plex Sans Arabic','IBM Plex Sans'":"'IBM Plex Sans','IBM Plex Sans Arabic'"},sans-serif">${ORN('tr','a')}${ORN('bl','b')}<div class="scroll" data-n="${n}">${body}</div></div></div>`;
 document.querySelector('.scroll').scrollTop = keep;
}
render();
</script>
</body>
</html>
